name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo or uses a secret; fork PRs get a read-only token.
# Actions are pinned to commit SHAs, not tags: a tag is mutable, so `@v7` can be
# repointed at new code by whoever controls the action. Dependabot's github-actions
# updater bumps these with the tag comment kept readable.
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No `version:` — pnpm/action-setup reads it from package.json's
      # `packageManager` field, and errors out if both are set.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Smoke: an empty home directory must parse cleanly, not crash.
      - run: VOLE_HOME_OVERRIDE=$RUNNER_TEMP/vole-home pnpm collect:once

  app:
    # The app uses macOS 26 API (Liquid Glass); the runner needs an Xcode 26 toolchain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: swift build --package-path apps/mac
