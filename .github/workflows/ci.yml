name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo or uses a secret; fork PRs get a read-only token.
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` — pnpm/action-setup reads it from package.json's
      # `packageManager` field, and errors out if both are set.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Smoke: an empty home directory must parse cleanly, not crash.
      - run: VOLE_HOME_OVERRIDE=$RUNNER_TEMP/vole-home pnpm collect:once

  app:
    # The app uses macOS 26 API (Liquid Glass); the runner needs an Xcode 26 toolchain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build --package-path apps/mac
      # Read-model parity: the TS reader (queries.ts) and the Swift reader (DB.swift)
      # are deliberately independent implementations of the same SQL — which is exactly
      # why they drift. Both dumps run against one deterministic fixture store and the
      # normalized JSON must be identical. queries.ts gained observed/baseline/threshold
      # on incidents while DB.swift silently didn't; this gate exists so that class of
      # drift can never land quietly again.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vole/core exec tsx scripts/parity-fixture.mjs "$RUNNER_TEMP/parity/vole.db"
      - run: VOLE_DB="$RUNNER_TEMP/parity/vole.db" pnpm --filter @vole/core exec tsx src/cli/readmodel-dump.ts > "$RUNNER_TEMP/parity/ts.json"
      - run: VOLE_DB="$RUNNER_TEMP/parity/vole.db" apps/mac/.build/debug/Vole --dump=readmodel > "$RUNNER_TEMP/parity/swift.json"
      - run: |
          diff <(jq -S . "$RUNNER_TEMP/parity/ts.json") <(jq -S . "$RUNNER_TEMP/parity/swift.json") \
            && echo "read-model parity: identical"
